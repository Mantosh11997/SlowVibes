name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you build on demand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  # Fast feedback: formatting, static analysis and tests. Runs on its own so a
  # typo fails in ~2 minutes instead of after a full Gradle build.
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Builds the installable APK.
  android:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      # FFmpegKit and AGP 9 both require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # NOTE: release here is signed with the debug key — android/app/build.gradle.kts
      # falls back to it when android/key.properties is absent, which it is in CI
      # (signing secrets are deliberately not committed). The artifact is fine for
      # testing and sideloading, but is NOT suitable for the Play Store.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slow-vibes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Split per ABI as well. FFmpegKit ships native binaries for every
      # architecture, so the universal APK is large; the per-ABI ones are
      # roughly a third the size.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: slow-vibes-apk-split
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30
