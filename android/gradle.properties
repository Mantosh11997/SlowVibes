org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Keep false, together with android.newDsl=false above.
#
# This project builds with AGP 9, where built-in Kotlin is the default and
# applying the Kotlin Gradle Plugin (KGP) is an error. But four of our plugins
# (just_audio, audio_session, share_plus, ffmpeg_kit_flutter_new_audio) still
# apply KGP unconditionally, so built-in Kotlin cannot be used yet — these two
# flags are AGP's documented escape hatch for exactly that situation.
#
# The one plugin that goes the other way is file_picker: its build.gradle
# *skips* KGP when AGP >= 9 and assumes built-in Kotlin will compile its
# sources. With built-in Kotlin off, nothing compiles them and the build fails
# with "cannot find symbol: FilePickerPlugin". android/build.gradle.kts applies
# KGP to that one subproject to close the gap.
android.builtInKotlin=false

# Kotlin incremental compilation writes cache files that Windows file locking
# (indexing / antivirus) intermittently holds open, which fails the build with
# "Could not close incremental caches". Full compilation of the plugins is a few
# seconds slower but reliable.
kotlin.incremental=false
